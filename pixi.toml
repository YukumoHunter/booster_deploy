[workspace]
name = "booster-deploy"
version = "0.2.0"
description = "Stateful squat policy deployment for Booster K1"
authors = ["Team whIRLwind"]
channels = [
    "https://prefix.dev/conda-forge",
    "https://prefix.dev/robostack-humble",
]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = ">=3.11,<3.12"
numpy = ">=1.26,<3"
pytorch = ">=2.5,<3"
mujoco = ">=3.3,<4"
onnxruntime = ">=1.20,<2"
ros-humble-rclpy = "*"
ruff = ">=0.12,<1"

[pypi-dependencies]
booster-sdk = ">=0.1.0,<0.2"
evdev = ">=1.7,<2"

[tasks]
deploy = "python scripts/deploy.py"
deploy-mujoco = "python scripts/deploy.py --mujoco"
list-tasks = "python scripts/deploy.py --list"
test = "python -m unittest discover -s tests -v"
lint = "ruff check --select E4,E7,E9,F ."
