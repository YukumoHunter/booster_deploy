[workspace]
name = "booster-deploy"
version = "0.2.0"
description = "Stateful squat policy deployment for Booster K1"
authors = ["Team whIRLwind"]
channels = [
    "https://prefix.dev/conda-forge",
    "https://prefix.dev/robostack-humble",
]
platforms = [
    { platform = "linux-64", glibc = "2.35" },
    { platform = "linux-aarch64", glibc = "2.35" },
]

[dependencies]
# Ubuntu 22.04's ROS 2 Humble Python packages and generated message bindings
# are built for CPython 3.10 on the robot.
python = ">=3.10,<3.11"
numpy = ">=1.26,<3"
pytorch = ">=2.5,<3"
mujoco = ">=3.3,<4"
onnxruntime = ">=1.20,<2"
ruff = ">=0.12,<1"

[pypi-dependencies]
booster-sdk = "==0.1.2-alpha.2"
evdev = ">=1.7,<2"

[tasks]
deploy = "bash -c 'source /opt/ros/humble/setup.bash && source /opt/booster/BoosterRos2Interface/install/setup.bash && python scripts/deploy.py'"
deploy-mujoco = "python scripts/deploy.py --mujoco"
list-tasks = "python scripts/deploy.py --list"
test = "python -m unittest discover -s tests -v"
lint = "ruff check --select E4,E7,E9,F ."
